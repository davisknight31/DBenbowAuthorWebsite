<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dana Benbow</title>
    <link rel="stylesheet" href="contact.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/027f32df51.js"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
</html>
<body>
  <div class="layout">
    <nav>
      <input type="checkbox" id="check" />
      <label for="check" class="checkbtn">
        <i class="fa-solid fa-bars"></i>
      </label>
      <label class="logo"
        ><a class="logo-link" href="home.html">Dana Benbow</a></label
      >
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="notable-work.html">Notable Work</a></li>
        <li><a class="active" href="#">Contact</a></li>
      </ul>
    </nav>

    <div class="contact-form-container">
      <div class="contact-form-title">Contact Me</div>
      <form
        id="contact-form"
        action="https://api.web3forms.com/submit"
        method="POST"
      >
        <input
          type="hidden"
          name="access_key"
          value="52a44cd1-a9f6-462b-8c49-b3abea2a9128"
        />
        <input
          class="contact-form-input"
          type="text"
          id="name"
          name="name"
          placeholder="Your Name"
          required
        />
        <input
          class="contact-form-input"
          type="email"
          id="email"
          name="email"
          placeholder="Your Email"
          required
        />
        <textarea
          class="contact-form-input"
          id="message"
          name="message"
          rows="4"
          placeholder="Your Message"
        ></textarea>
        <button class="submit-button" type="submit">Send</button>
      </form>
    </div>
    <div class="footer-container">
      <div class="link-icons">
        <a href="https://twitter.com/DanaBenbow" target="_blank"
          ><img class="icon" src="./images/x-logo.png"
        /></a>
        <a href="https://www.facebook.com/dana.hunsingerbenbow/" target="_blank"
          ><img class="icon" src="./images/facebook-logo.png"
        /></a>
        <a href="https://www.instagram.com/danabenbow/?hl=en" target="_blank"
          ><img class="icon" src="./images/instagram-logo.png"
        /></a>
        <a
          href="https://www.linkedin.com/in/dana-benbow-583388172/"
          target="_blank"
          ><img class="icon" src="./images/linkedin-logo.png"
        /></a>
      </div>
    </div>
  </div>
</body>
